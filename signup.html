<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up </title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
     <a href="/"><img src="./amazon_clone_img/assets/amazon_logo_dark.png" alt="" class="logo" width="100px"></a>
    <div class="signin-container">
        <h1 class="signin-title">Sign up</h1>
        <h5 class="input-label">Your name</h5>
        <input type="text" placeholder="First and Last name">
                <h5 class="input-label">Mobile number or email</h5>
        <input type="text" >
                <h5 class="input-label">Password</h5>
                <div class="password-container">
        <input type="password" placeholder="At least 6 characters" id="myInput">
                     <i class="fa-solid fa-eye" id="togglePassword"></i>
                 </div>
        <button>Continue</button>
        <p class="sigin-condition">By continuing you agree to Amazon's <span>Conditions of Use </span>and <span>Privacy Notice</span></p>
        <p class="signin-help">&#9656 <span>Need help</span></p>
        <hr>
        <h4>Buying for work?</h4>
        <p class="signin-business"><span>Shop on Amazon Business</span></p>
    </div>
    <div class="signin-bottom">
        <hr>
        <p>Alreay have an account ?</p>
        <hr>
    </div>
    <a href="./signin.html">
    <button class="signin-signup-btn">Log in your Amazon account</button>
    </a>
    <footer>
        <div class="footer-links">
            <a href="#">Conditions of use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p class="footer-copyright">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </footer>
    <script src="./signup.js"></script>
</body>
</html>
